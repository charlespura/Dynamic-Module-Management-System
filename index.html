<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Module Management System - Demo</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <!-- Font Awesome 4 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #f5f7fa;
        }

        /* Login Page */
        #loginPage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .login-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-card .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-card .form-group {
            margin-bottom: 20px;
        }

        .login-card label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .login-card .form-control {
            border-radius: 8px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }

        .login-card .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-card .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-card .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .login-card .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-card .error-message {
            color: #dc3545;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }

        .login-card .demo-credentials {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #6c757d;
        }

        .login-card .demo-credentials strong {
            color: #2c3e50;
        }

        /* Main App Layout */
        #app {
            display: none;
        }

        .sidebar-wrapper {
            padding: 0;
            min-height: 100vh;
            background: #2c3e50;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            color: white;
            text-align: center;
            border-bottom: 1px solid #34495e;
        }

        .sidebar-header h4 {
            margin: 0;
            font-weight: 700;
            font-size: 18px;
        }

        .sidebar-header small {
            display: block;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav li {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-nav .nav-link {
            color: #8aa4b8;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .sidebar-nav .nav-link:hover {
            color: white;
            background: #1a252f;
        }

        .sidebar-nav .nav-link.active {
            color: white;
            background: #1a252f;
            border-left: 4px solid #667eea;
        }

        .sidebar-nav .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .sidebar-nav .arrow {
            float: right;
        }

        .sidebar-nav .sub-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            background: #1a252f;
        }

        .sidebar-nav .sub-menu .nav-link {
            padding-left: 45px;
            font-size: 13px;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px 30px;
            min-height: 100vh;
        }

        .top-bar {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
        }

        .top-bar .page-title small {
            font-weight: 400;
            font-size: 14px;
            color: #6c757d;
            margin-left: 10px;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: #c82333;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        /* Cards */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        .card .card-body {
            padding: 25px;
        }

        .stats-card {
            border-radius: 12px;
            padding: 20px;
            color: white;
        }

        .stats-card h5 {
            opacity: 0.8;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stats-card h2 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }

        .bg-primary-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .bg-success-gradient {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }
        .bg-warning-gradient {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
        }
        .bg-info-gradient {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        /* Buttons */
        .btn-primary {
            background: #667eea;
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-danger {
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-warning {
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-secondary {
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        /* Table */
        .table th {
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #e9ecef;
        }
        .table td {
            vertical-align: middle;
        }

        /* Badge */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }

        /* Menu Items */
        .menu-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .menu-item-header {
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-item-header .menu-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-item-header .menu-actions {
            display: flex;
            gap: 5px;
        }
        .submenu-list {
            margin-left: 30px;
            padding-left: 15px;
            border-left: 2px solid #dee2e6;
            list-style: none;
        }
        .submenu-item {
            padding: 8px 14px;
            margin: 4px 0;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-container {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h5 {
            margin: 0;
            font-weight: 700;
            color: #2c3e50;
        }

        .modal-header .close {
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6c757d;
            padding: 0 10px;
        }

        .modal-header .close:hover {
            color: #000;
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 15px 25px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #667eea;
            outline: 0;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .text-muted {
            color: #6c757d;
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }

        .toast {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 10px;
            min-width: 300px;
            animation: slideInRight 0.3s ease;
            border-left: 4px solid;
        }

        .toast-success {
            border-left-color: #28a745;
        }
        .toast-error {
            border-left-color: #dc3545;
        }
        .toast-info {
            border-left-color: #17a2b8;
        }

        .toast .toast-title {
            font-weight: 700;
            font-size: 14px;
        }
        .toast .toast-message {
            font-size: 13px;
            color: #6c757d;
            margin-top: 4px;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar-wrapper {
                width: 100%;
                height: auto;
                position: relative;
                min-height: auto;
            }
            .main-content {
                margin-left: 0;
                padding: 15px;
            }
            .sidebar-nav .nav-link {
                padding: 10px 16px;
            }
            .sidebar-nav .sub-menu .nav-link {
                padding-left: 35px;
            }
            .modal-container {
                max-width: 100%;
                margin: 10px;
            }
            .menu-item-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .menu-item-header .menu-actions {
                width: 100%;
                justify-content: flex-start;
            }
            .stats-card h2 {
                font-size: 24px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .sidebar-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-wrapper::-webkit-scrollbar-track {
            background: #1a252f;
        }
        .sidebar-wrapper::-webkit-scrollbar-thumb {
            background: #34495e;
        }
    </style>
</head>
<body>

    <!-- ==================== LOGIN PAGE ================== -->
    <div id="loginPage">
        <div class="login-card">
            <h2><i class="fa fa-cubes" style="color:#667eea;"></i> Dynamic Module System DEMO ONLY</h2>
            <p class="subtitle">Enterprise Module Management Platform</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" value="admin@example.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-control" value="password" required />
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fa fa-sign-in"></i> Login
                </button>
                <div id="loginError" class="error-message"></div>
            </form>

            <div class="demo-credentials">
                <strong>Demo Credentials:</strong><br />
                Email: <strong>admin@example.com</strong><br />
                Password: <strong>password</strong>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN APP ==================== -->
    <div id="app">
        <!-- Sidebar -->
        <div class="sidebar-wrapper" id="sidebar">
            <div class="sidebar-header">
                <h4><i class="fa fa-cubes"></i> System</h4>
                <small>Dynamic Module System DEMO ONLY</small>
            </div>
            <ul class="sidebar-nav" id="sidebarNav">
                <!-- Dynamically rendered -->
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div>
                    <span class="page-title" id="pageTitle">Dashboard <small>Overview</small></span>
                </div>
                <button class="btn-logout" onclick="handleLogout()">
                    <i class="fa fa-sign-out"></i> Logout
                </button>
            </div>

            <!-- Content Area -->
            <div id="contentArea">
                <!-- Dynamically rendered -->
            </div>
        </div>
    </div>

    <!-- ==================== TOAST CONTAINER ==================== -->
    <div class="toast-container" id="toastContainer"></div>

        // Initialize data
        function initData() {
            if (!localStorage.getItem('dynamic_system_data')) {
                localStorage.setItem('dynamic_system_data', JSON.stringify(DEFAULT_DATA));
            }
        }

        function getData() {
            return JSON.parse(localStorage.getItem('dynamic_system_data'));
        }

        function saveData(data) {
            localStorage.setItem('dynamic_system_data', JSON.stringify(data));
        }

        // ============================================================
        // AUTHENTICATION
        // ============================================================

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Logging in...';

            setTimeout(() => {
                if (email === 'admin@example.com' && password === 'password') {
                    localStorage.setItem('auth_token', 'demo_token_12345');
                    localStorage.setItem('user', JSON.stringify({
                        name: 'Admin User',
                        email: 'admin@example.com',
                        role: 'Administrator'
                    }));
                    showToast('success', 'Login Successful', 'Welcome back, Admin!');
                    showApp();
                } else {
                    errorEl.textContent = 'Invalid credentials. Please try again.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa fa-sign-in"></i> Login';
                }
            }, 800);
        }

        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            if (token) {
                showApp();
            } else {
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        }

        function handleLogout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user');
            showToast('info', 'Logged Out', 'You have been logged out successfully.');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
            document.getElementById('loginError').textContent = '';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerHTML = '<i class="fa fa-sign-in"></i> Login';
        }

        function showApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            initData();
            renderSidebar();
            navigateTo('/dashboard');
        }

        // ============================================================
        // SIDEBAR RENDERER
        // ============================================================

        let openMenus = new Set();

        function renderSidebar() {
            const data = getData();
            const menus = data.menus;
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = '';

            // Get top-level menus
            const topMenus = menus.filter(m => m.parent_id === null && m.status === 1)
                .sort((a, b) => a.sort_order - b.sort_order);

            topMenus.forEach(menu => {
                const children = menus.filter(m => m.parent_id === menu.id && m.status === 1)
                    .sort((a, b) => a.sort_order - b.sort_order);

                const li = document.createElement('li');

                if (children.length > 0) {
                    // Dropdown
                    const isOpen = openMenus.has(menu.id);
                    li.innerHTML = `
                        <a class="nav-link" onclick="toggleMenu(${menu.id})">
                            <i class="fa fa-${menu.icon}"></i>
                            ${menu.name}
                            <span class="arrow">
                                <i class="fa fa-${isOpen ? 'chevron-down' : 'chevron-right'}"></i>
                            </span>
                        </a>
                        <ul class="sub-menu" id="submenu_${menu.id}" style="${isOpen ? 'display:block;' : 'display:none;'}">
                            ${children.map(child => `
                                <li>
                                    <a class="nav-link" onclick="navigateTo('${child.route}')" data-route="${child.route}">
                                        <i class="fa fa-${child.icon}"></i>
                                        ${child.name}
                                    </a>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                } else {
                    li.innerHTML = `
                        <a class="nav-link" onclick="navigateTo('${menu.route}')" data-route="${menu.route}">
                            <i class="fa fa-${menu.icon}"></i>
                            ${menu.name}
                        </a>
                    `;
                }

                nav.appendChild(li);
            });

            // Highlight active route
            const currentRoute = getCurrentRoute();
            document.querySelectorAll('.sidebar-nav .nav-link').forEach(el => {
                el.classList.remove('active');
                if (el.getAttribute('data-route') === currentRoute) {
                    el.classList.add('active');
                }
            });
        }

        function toggleMenu(id) {
            if (openMenus.has(id)) {
                openMenus.delete(id);
            } else {
                openMenus.add(id);
            }
            renderSidebar();
        }

        function getCurrentRoute() {
            return window.location.hash.replace('#', '') || '/dashboard';
        }

        // ============================================================

        function navigateTo(route) {
            window.location.hash = route;
            renderPage(route);
            renderSidebar();

        window.addEventListener('hashchange', () => {
            const route = getCurrentRoute();
            renderPage(route);
            renderSidebar();
        });

        function openMenuModal(parentId = null) {
            editingMenu = null;
            showMenuModal = true;
            if (parentId) {
                // Pre-select parent
                setTimeout(() => {
                    document.getElementById('menuParent').value = parentId;
                }, 100);
            }
            renderPage('/settings/menus');
        }

        function editMenu(id) {
            editingMenu = id;
            showMenuModal = true;
            renderPage('/settings/menus');
        }

        function closeMenuModal() {
            showMenuModal = false;
            editingMenu = null;
            renderPage('/settings/menus');
        }

        function saveMenu(e) {
            e.preventDefault();
            const data = getData();
            const name = document.getElementById('menuName').value;
            const parent_id = document.getElementById('menuParent').value || null;
            const icon = document.getElementById('menuIcon').value || 'folder';
            const route = document.getElementById('menuRoute').value || `/${name.toLowerCase().replace(/\s+/g, '-')}`;
            const component = document.getElementById('menuComponent').value || name.replace(/\s+/g, '');
            const sort_order = parseInt(document.getElementById('menuSortOrder').value) || 0;
            const status = parseInt(document.getElementById('menuStatus').value);

            if (editingMenu) {
                // Update
                const index = data.menus.findIndex(m => m.id === editingMenu);
                if (index !== -1) {
                    data.menus[index] = { ...data.menus[index], name, parent_id: parent_id || null, icon, route, component,
                        sort_order, status };
                }
                showToast('success', 'Updated', `"${name}" has been updated successfully.`);
            } else {
                // Create
                const newId = Math.max(0, ...data.menus.map(m => m.id)) + 1;
                data.menus.push({
                    id: newId,
                    parent_id: parent_id || null,
                    name,
                    icon,
                    route,
                    component,
                    sort_order,
                    status,
                    created_at: new Date().toISOString()
                });
                showToast('success', 'Created', `"${name}" has been created successfully.`);
            }

            saveData(data);
            closeMenuModal();
            renderSidebar();
        }

        function deleteMenu(id) {
            if (!confirm('Are you sure you want to delete this menu?')) return;

            const data = getData();
            // Delete the menu and all its children
            const toDelete = [id];
            const children = data.menus.filter(m => m.parent_id === id);
            children.forEach(c => toDelete.push(c.id));

            data.menus = data.menus.filter(m => !toDelete.includes(m.id));
            saveData(data);
            showToast('success', 'Deleted', 'Menu has been deleted successfully.');
            renderPage('/settings/menus');
            renderSidebar();
        }

        function openProjectModal() {
            editingProject = null;
            showProjectModal = true;
            renderPage('/projects');
        }

        function editProject(id) {
            editingProject = id;
            showProjectModal = true;
            renderPage('/projects');
        }

        function closeProjectModal() {
            showProjectModal = false;
            editingProject = null;
            renderPage('/projects');
        }

        function saveProject(e) {
            e.preventDefault();
            const data = getData();
            const name = document.getElementById('projectName').value;
            const description = document.getElementById('projectDescription').value;
            const status = document.getElementById('projectStatus').value;
            const start_date = document.getElementById('projectStart').value;
            const deadline = document.getElementById('projectDeadline').value;

            if (editingProject) {
                const index = data.projects.findIndex(p => p.id === editingProject);
                if (index !== -1) {
                    data.projects[index] = { ...data.projects[index], name, description, status, start_date, deadline };
                }
                showToast('success', 'Updated', `"${name}" has been updated successfully.`);
            } else {
                const newId = Math.max(0, ...data.projects.map(p => p.id)) + 1;
                data.projects.push({
                    id: newId,
                    name,
                    description,
                    status,
                    start_date,
                    deadline,
                    created_at: new Date().toISOString()
                });
                showToast('success', 'Created', `"${name}" has been created successfully.`);
            }

            saveData(data);
            closeProjectModal();
            renderPage('/projects');
        }

        function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;

            const data = getData();
            data.projects = data.projects.filter(p => p.id !== id);
            saveData(data);
            showToast('success', 'Deleted', 'Project has been deleted successfully.');
            renderPage('/projects');
        }

        function viewProject(id) {
            const data = getData();
            const project = data.projects.find(p => p.id === id);
            if (project) {
                alert(`📋 Project Details\n\nName: ${project.name}\nDescription: ${project.description || 'N/A'}\nStatus: ${project.status}\nStart Date: ${project.start_date || 'N/A'}\nDeadline: ${project.deadline || 'N/A'}`);

        }

        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `
                <div class="toast-title"><i class="fa ${icons[type] || icons.info}"></i> ${title}</div>
                <div class="toast-message">${message}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
