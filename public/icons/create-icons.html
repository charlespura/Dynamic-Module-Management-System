<!DOCTYPE html>
<html>
<head>
    <title>Create PWA Icons</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
        .icon-item { text-align: center; border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
        .icon-item canvas { border: 1px solid #eee; border-radius: 8px; }
        button { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #5a67d8; }
        .download-btn { background: #28a745; margin-left: 10px; }
        .download-btn:hover { background: #218838; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <h1>📱 PWA Icon Generator</h1>
    <p>Generate all required PWA icons with one click</p>
    
    <button onclick="generateAllIcons()">🎨 Generate All Icons</button>
    <button onclick="downloadAllIcons()" class="download-btn">⬇️ Download All</button>
    
    <div id="status"></div>
    <div class="icon-grid" id="iconGrid"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const colors = ['#667eea', '#764ba2'];
        let generatedIcons = {};

        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 10;
            
            // Rounded rectangle
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Draw 3D Box
            ctx.shadowBlur = 0;
            const boxSize = size * 0.6;
            const offset = (size - boxSize) / 2;

            // Main box
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(offset, offset + boxSize * 0.2, boxSize, boxSize * 0.6);
            
            // Box top
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(offset + boxSize * 0.2, offset, boxSize * 0.6, boxSize * 0.4);

            // Inner square
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            const innerSize = boxSize * 0.4;
            ctx.fillRect(offset + boxSize * 0.3, offset + boxSize * 0.3, innerSize, innerSize);

            // Text
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = `bold ${size * 0.1}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('DMS', size / 2, size - size * 0.08);

            // Small decorative elements
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(size * 0.2, size * 0.2, size * 0.04, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(size * 0.8, size * 0.8, size * 0.04, 0, Math.PI * 2);
            ctx.fill();

            return canvas;
        }

        function generateAllIcons() {
            const grid = document.getElementById('iconGrid');
            const status = document.getElementById('status');
            grid.innerHTML = '';
            generatedIcons = {};

            sizes.forEach(size => {
                const canvas = generateIcon(size);
                generatedIcons[size] = canvas;
                
                const div = document.createElement('div');
                div.className = 'icon-item';
                div.innerHTML = `
                    <canvas width="${size}" height="${size}" style="width:80px;height:80px;"></canvas>
                    <div>${size}x${size}</div>
                    <button onclick="downloadIcon(${size})" style="margin-top:5px;padding:4px 12px;font-size:12px;">Download</button>
                `;
                const imgCanvas = div.querySelector('canvas');
                imgCanvas.getContext('2d').drawImage(canvas, 0, 0);
                grid.appendChild(div);
            });

            status.innerHTML = '<p class="success">✅ All icons generated successfully!</p>';
            status.innerHTML += '<p>Click "Download All" to save all icons, or download individually.</p>';
        }

        function downloadIcon(size) {
            const canvas = generatedIcons[size];
            if (!canvas) {
                alert('Please generate icons first!');
                return;
            }
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function downloadAllIcons() {
            if (Object.keys(generatedIcons).length === 0) {
                alert('Please generate icons first!');
                return;
            }

            // Download each icon with a delay
            sizes.forEach((size, index) => {
                setTimeout(() => {
                    downloadIcon(size);
                }, index * 300);
            });

            document.getElementById('status').innerHTML += '<p class="success">📥 Downloading all icons...</p>';
        }

        // Auto-generate on load
        window.onload = function() {
            generateAllIcons();
        };
    </script>
</body>
</html>
